[project]
name = "youtube-transcript-mcp"
version = "0.1.0"
description = "MCP server that fetches YouTube video metadata and transcripts."
readme = "README.md"
authors = [
    { name = "Kenny", email = "74329344+kennyrnwilson@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.201.0",
    "mcp>=1.12,<2",
    "youtube-transcript-api>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[project.scripts]
youtube-transcript-mcp = "youtube_transcript_mcp.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
